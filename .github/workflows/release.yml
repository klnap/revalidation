name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: mode

  version:
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          script: sh -c "bun run changeset:version && bun run changeset:version-check"
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          pr-base-branch: main

  pack:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      source-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - name: Check release identity before packing
        env:
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.name !== "@klnap/revalidation") throw new Error("Unexpected npm package name.");
          if (pkg.repository?.url !== `git+${process.env.EXPECTED_REPOSITORY}`) throw new Error("package.json repository.url must match this GitHub repository.");
          if (pkg.publishConfig?.access !== "public" || pkg.publishConfig?.registry !== "https://registry.npmjs.org/") throw new Error("Publishing must target the public npm registry.");
          NODE

      - run: bun run check

      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.prepare.outputs.publish-plan-artifact-id }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/changesets-pack

      - name: Verify the exact packed release artifact
        env:
          PACK_DIR: ${{ runner.temp }}/changesets-pack
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import path from "node:path";
          const root = process.env.PACK_DIR;
          const plan = JSON.parse(readFileSync(path.join(root, "publish-plan.json"), "utf8"));
          const releases = plan.plan.flat().filter((release) => release.kind === "publish");
          if (releases.length !== 1) throw new Error(`Expected one package tarball, found ${releases.length}.`);
          const release = releases[0];
          const tarball = path.join(root, release.tarball.path);
          const bytes = readFileSync(tarball);
          const integrity = `sha256-${createHash("sha256").update(bytes).digest("base64")}`;
          if (integrity !== release.tarball.integrity) throw new Error("Packed tarball integrity does not match Changesets publish plan.");
          const files = execFileSync("tar", ["-tzf", tarball], { encoding: "utf8" }).trim().split("\n");
          const allowedFile = (file) => ["package/package.json", "package/README.md", "package/CHANGELOG.md", "package/LICENSE"].includes(file) || file.startsWith("package/dist/") || file.startsWith("package/docs/");
          if (files.some((file) => !allowedFile(file))) throw new Error(`Unexpected tarball file: ${files.find((file) => !allowedFile(file))}`);
          const pkg = JSON.parse(execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }));
          if (pkg.name !== release.name || pkg.version !== release.version) throw new Error("Tarball identity does not match the Changesets release plan.");
          if (pkg.repository?.url !== `git+${process.env.EXPECTED_REPOSITORY}`) throw new Error("Tarball repository does not match the source repository.");
          if (pkg.private === true || pkg.publishConfig?.access !== "public" || pkg.publishConfig?.registry !== "https://registry.npmjs.org/") throw new Error("Tarball publishing metadata is unsafe.");
          const expectedExports = [".", "./sources/payload", "./producers/payload", "./consumers/next", "./consumers/next/tags", "./dispatchers", "./dispatchers/http"];
          if (JSON.stringify(Object.keys(pkg.exports ?? {}).sort()) !== JSON.stringify(expectedExports.sort())) throw new Error("Unexpected package exports.");
          const publicDeclarations = [];
          for (const [subpath, targets] of Object.entries(pkg.exports)) {
            if (!targets.types || !targets.default) throw new Error(`Incomplete exports for ${subpath}.`);
            for (const target of [targets.types, targets.default]) {
              const file = `package/${target.replace(/^\.\//u, "")}`;
              if (!files.includes(file)) throw new Error(`Missing packed export target: ${file}`);
              if (target.endsWith(".d.ts")) publicDeclarations.push(file);
            }
          }
          for (const file of ["package/README.md", "package/CHANGELOG.md", "package/LICENSE"]) {
            if (!files.includes(file)) throw new Error(`Missing packed file: ${file}`);
          }
          const obsolete = /createCache|createRevalidationHandler|normalizeTargets|resolveRevalidationTargets|setRevalidationPluginTarget|resetRevalidationPluginTarget/u;
          for (const file of publicDeclarations) {
            const declaration = execFileSync("tar", ["-xOf", tarball, file], { encoding: "utf8" });
            if (obsolete.test(declaration)) throw new Error(`Obsolete API in ${file}.`);
          }
          const readme = execFileSync("tar", ["-xOf", tarball, "package/README.md"], { encoding: "utf8" });
          if (!readme.includes("Declarative, type-safe cache revalidation.")) throw new Error("README description is incorrect.");
          console.log(`Verified ${release.name}@${release.version} with ${publicDeclarations.length} declarations.`);
          NODE

  publish:
    needs: [prepare, pack]
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify artifact belongs to this source commit
        env:
          PACK_SOURCE_SHA: ${{ needs.pack.outputs.source-sha }}
        run: test "$PACK_SOURCE_SHA" = "$GITHUB_SHA"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: publish
        with:
          github-token: ${{ github.token }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false
          push-git-tags: true

      - name: Verify release tag and create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          TAG="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (published.length !== 1) throw new Error(`Expected one published package, found ${published.length}.`);
          if (published[0].name !== pkg.name || published[0].version !== pkg.version) throw new Error("Published package does not match package.json.");
          process.stdout.write(`v${pkg.version}`);
          NODE
          )"
          TAG_SHA="$(TAG="$TAG" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const base = `repos/${process.env.GITHUB_REPOSITORY}/git`;
          const ref = JSON.parse(execFileSync("gh", ["api", `${base}/ref/tags/${process.env.TAG}`], { encoding: "utf8" }));
          const object = ref.object.type === "tag"
            ? JSON.parse(execFileSync("gh", ["api", `${base}/tags/${ref.object.sha}`], { encoding: "utf8" })).object
            : ref.object;
          process.stdout.write(object.sha);
          NODE
          )"
          if [ "$TAG_SHA" != "$RELEASE_SOURCE_SHA" ]; then
            echo "Release tag $TAG points to ${TAG_SHA:-no commit}, expected $RELEASE_SOURCE_SHA." >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --generate-notes
