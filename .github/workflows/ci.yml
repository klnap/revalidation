name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE; const valid = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$/u.test(title); if (!valid) { console.error("Invalid Conventional Commit title: " + title); process.exit(1); }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - name: Pack and validate public files and declarations
        id: pack
        env:
          TARBALL_DIR: ${{ runner.temp }}
        run: |
          npm pack --pack-destination "$TARBALL_DIR" --json > "$TARBALL_DIR/pack.json"
          TARBALL="$(node -e 'const path = require("node:path"); const result = require(process.argv[1]); const pack = Array.isArray(result) ? result[0] : Object.values(result)[0]; process.stdout.write(path.join(process.env.TARBALL_DIR, pack.filename));' "$TARBALL_DIR/pack.json")"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
          TARBALL="$TARBALL" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const tarball = process.env.TARBALL;
          const files = execFileSync("tar", ["-tzf", tarball], { encoding: "utf8" }).trim().split("\n");
          const manifest = JSON.parse(execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }));
          const expectedExports = [".", "./sources/payload", "./producers/payload", "./consumers/next", "./dispatchers", "./dispatchers/http"];
          if (JSON.stringify(Object.keys(manifest.exports ?? {}).sort()) !== JSON.stringify(expectedExports.sort())) throw new Error("Unexpected package exports.");
          const publicDeclarations = [];
          for (const [subpath, targets] of Object.entries(manifest.exports)) {
            if (!targets.types || !targets.default) throw new Error(`Incomplete exports for ${subpath}.`);
            for (const target of [targets.types, targets.default]) {
              const file = `package/${target.replace(/^\.\//u, "")}`;
              if (!files.includes(file)) throw new Error(`Missing packed export target: ${file}`);
              if (target.endsWith(".d.ts")) publicDeclarations.push(file);
            }
          }
          for (const file of ["package/README.md", "package/CHANGELOG.md", "package/LICENSE"]) {
            if (!files.includes(file)) throw new Error(`Missing packed file: ${file}`);
          }
          const obsolete = /createCache|createRevalidationHandler|normalizeTargets|resolveRevalidationTargets|setRevalidationPluginTarget|resetRevalidationPluginTarget/u;
          for (const file of publicDeclarations) {
            const declaration = execFileSync("tar", ["-xOf", tarball, file], { encoding: "utf8" });
            if (obsolete.test(declaration)) throw new Error(`Obsolete API in ${file}.`);
          }
          const readme = execFileSync("tar", ["-xOf", tarball, "package/README.md"], { encoding: "utf8" });
          if (!readme.includes("Declarative, type-safe cache revalidation.")) throw new Error("README description is incorrect.");
          console.log(`Validated ${files.length} files and ${publicDeclarations.length} public declarations.`);
          NODE

      - run: bun run test:integration

      - name: Test the packed package in Payload and Next.js
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
        run: bun run test:consumer-smoke -- "$TARBALL"

      - name: Install the tarball for Node.js runtime checks
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          CONSUMER_DIR: ${{ runner.temp }}/node-consumer
        run: | # zizmor: ignore[adhoc-packages] install the exact local tarball and pinned framework peers under test
          mkdir -p "$CONSUMER_DIR"
          NEXT_VERSION="$(node -p 'require("./package.json").devDependencies.next')"
          PAYLOAD_VERSION="$(node -p 'require("./package.json").devDependencies.payload')"
          npm install --prefix "$CONSUMER_DIR" --ignore-scripts --no-audit --no-fund \
            "$TARBALL" "next@$NEXT_VERSION" "payload@$PAYLOAD_VERSION" react@19.3.1 react-dom@19.3.1
          cp tests/fixtures/consumer/runtime.mjs "$CONSUMER_DIR/"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js 22 version
        working-directory: ${{ runner.temp }}/node-consumer
        run: node runtime.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js 24 version
        working-directory: ${{ runner.temp }}/node-consumer
        run: node runtime.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Test the tarball on the minimum supported Node.js 26 version
        working-directory: ${{ runner.temp }}/node-consumer
        run: node runtime.mjs

  security:
    name: security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
